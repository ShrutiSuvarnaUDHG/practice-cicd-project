name: CI

# Milestone 1: run automatically on every push and every pull request
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Use the secret
        env:
          API_KEY: ${{ secrets.PRACTICE_API_KEY }}
        run: echo "Using API key that starts with ${API_KEY:0:3}..."
        
        
