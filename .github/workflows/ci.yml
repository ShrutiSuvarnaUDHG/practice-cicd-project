name: CI
# continuous integration workflow for the calculator project
on: # Trigger the workflow on push or pull request events to the main or develop branches
  push: 
    branches: [main, develop] 
  pull_request:
    branches: [main, develop]

jobs: # group of steps to be performed on a runner
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --cov=calculator --cov-report=html

      - name: Use the secret
        env:
          API_KEY: ${{ secrets.PRACTICE_API_KEY }}
        run: echo "Using API key that starts with ${API_KEY:0:3}..."

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 #check code style and quality
        run: flake8 calculator.py test_calculator.py --max-line-length=100

  deploy:
    needs: [build-and-test, lint]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy (pretend)
        run: echo "Deploying to production..."

